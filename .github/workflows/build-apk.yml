name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  APP_NAME: AI-Fitness-Coach

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use preinstalled Android SDK - no external action needed
      - name: Configure Android SDK
        run: |
          # GitHub runners have Android SDK preinstalled at ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Accept all licenses silently
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Ensure required components are installed
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          
          echo "✅ Android SDK configured successfully"
          echo "SDK Location: $ANDROID_HOME"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform (Capacitor)
        run: |
          # Remove existing android folder if present (will be regenerated)
          rm -rf android
          # Add fresh android platform via Capacitor
          npx cap add android
          echo "✅ Android platform added"

      - name: Sync Capacitor
        run: |
          npx cap sync android
          echo "✅ Capacitor synced"

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
          arguments: assembleDebug --no-daemon
          build-root-directory: android

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fitness-Coach-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release Build (only when secrets are available)
      - name: Decode Keystore
        if: (github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')) && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: gradle/gradle-build-action@v3
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          gradle-version: '8.5'
          arguments: assembleRelease --no-daemon
          build-root-directory: android

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fitness-Coach-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  # Create GitHub Release (only on tags)
  release:
    name: Create GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: AI-Fitness-Coach-Release-APK
          path: artifacts/

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv artifacts/app-release.apk "AI-Fitness-Coach-v${VERSION}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Fitness-Coach-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Summary
  summary:
    name: Build Summary
    needs: [build-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "## 🏋️ AI Fitness Coach - Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node:** 24 | **Java:** 17 | **Gradle:** 8.5 | **SDK:** 34" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download APK" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to **Actions** tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Download from **Artifacts** section" >> $GITHUB_STEP_SUMMARY
