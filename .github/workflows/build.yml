name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: AI-Fitness-Coach

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "✅ Android SDK configured"

      - name: Install Dependencies
        run: |
          npm ci
          echo "✅ Dependencies installed"

      - name: Build Web Application
        run: |
          npm run build
          echo "✅ Web app built"

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android
          echo "✅ Android platform added"

      - name: Sync Capacitor
        run: |
          npx cap sync android
          echo "✅ Capacitor synced"

      - name: Update Gradle Wrapper
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.13-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
          echo "✅ Gradle wrapper updated"

      - name: Build Debug APK
        if: !startsWith(github.ref, 'refs/tags/')
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "✅ Debug APK built"

      - name: Upload Debug APK
        if: !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fitness-Coach-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (Unsigned)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✅ Release APK built"

      - name: Get Version
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/AI-Fitness-Coach-v${{ env.VERSION }}.apk"
          echo "✅ APK renamed"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.apk
          name: "AI Fitness Coach v${{ env.VERSION }}"
          body: |
            ## 🏋️ دستیار هوشمند بدنسازی نسخه ${{ env.VERSION }}
            
            ### ✨ ویژگی‌های اصلی:
            - 🤖 تولید برنامه تمرینی با هوش مصنوعی
            - 📊 ردیابی پیشرفت و آمار کامل
            - 📅 تقویم شمسی
            - 🎯 مدیریت چند پروفایل ورزشکار
            - 💪 ردیاب تمرین حرفه‌ای
            - 🌙 تم تاریک و روشن
            
            ### 📱 نصب:
            1. فایل APK را دانلود کنید
            2. روی فایل کلیک کنید
            3. مجوز نصب از منابع ناشناس را بدهید
            4. نصب را تکمیل کنید
            
            ### 🔧 اطلاعات فنی:
            - حداقل Android: 7.0 (API 24)
            - حجم: ~15 MB
            - معماری: Universal
            
            ### 📝 تغییرات این نسخه:
            - انتشار اولیه
            - تمام ویژگی‌های اصلی
            
            ---
            **ساخته شده با ❤️ برای جامعه بدنسازی ایران**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "### 📦 Release Build" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "- **APK:** AI-Fitness-Coach-v${{ env.VERSION }}.apk" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📦 Debug Build" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **APK:** app-debug.apk" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "APK file is available in the artifacts." >> $GITHUB_STEP_SUMMARY
