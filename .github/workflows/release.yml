name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  APP_NAME: AI-Fitness-Coach

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update Gradle Wrapper
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.13-bin.zip|g' gradle/wrapper/gradle-wrapper.properties

      # Generate signing key if not exists
      - name: Generate Signing Key
        if: env.KEYSTORE_BASE64 == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Generating new signing key..."
            keytool -genkey -v -keystore android/app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias ai-fitness-key \
              -storepass "AIFitness2024!" \
              -keypass "AIFitness2024!" \
              -dname "CN=AI Fitness Coach, OU=Development, O=AI Fitness, L=Tehran, ST=Tehran, C=IR"
            echo "SIGNING_KEY_GENERATED=true" >> $GITHUB_ENV
            echo "SIGNING_PASSWORD=AIFitness2024!" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            echo "SIGNING_KEY_GENERATED=false" >> $GITHUB_ENV
          fi

      - name: Configure Signing
        run: |
          cd android/app
          cat >> build.gradle << 'EOF'
          
          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "${System.getenv('SIGNING_PASSWORD') ?: 'AIFitness2024!'}"
                      keyAlias "ai-fitness-key"
                      keyPassword "${System.getenv('SIGNING_PASSWORD') ?: 'AIFitness2024!'}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release APK
        env:
          SIGNING_PASSWORD: ${{ env.SIGNING_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          fi

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/AI-Fitness-Coach-v${{ env.VERSION }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fitness-Coach-Release
          path: release/*.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.apk
          name: "AI Fitness Coach v${{ env.VERSION }}"
          body: |
            ## 🏋️ دستیار هوشمند بدنسازی نسخه ${{ env.VERSION }}
            
            ### ✨ ویژگی‌های اصلی:
            - 🤖 تولید برنامه تمرینی با هوش مصنوعی
            - 📊 ردیابی پیشرفت و آمار کامل
            - 📅 تقویم شمسی
            - 🎯 مدیریت چند پروفایل ورزشکار
            - 💪 ردیاب تمرین حرفه‌ای
            - 🌙 تم تاریک و روشن
            
            ### 📱 نصب:
            1. فایل APK را دانلود کنید
            2. روی فایل کلیک کنید
            3. مجوز نصب از منابع ناشناس را بدهید
            4. نصب را تکمیل کنید
            
            ### 🔧 اطلاعات فنی:
            - حداقل Android: 7.0 (API 24)
            - حجم: ~15 MB
            - معماری: Universal (ARM, ARM64, x86)
            
            ### 📝 تغییرات این نسخه:
            - انتشار اولیه
            - تمام ویژگی‌های اصلی
            
            ---
            **ساخته شده با ❤️ برای جامعه بدنسازی ایران**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## 🎉 Release Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** $(du -h release/*.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "APK file is available in the release artifacts and GitHub Releases." >> $GITHUB_STEP_SUMMARY
