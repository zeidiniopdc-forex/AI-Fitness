<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="4"/>
  
  <!-- Dumbbell -->
  <g transform="translate(256, 256)">
    <!-- Left weight plate -->
    <rect x="-140" y="-30" width="40" height="60" rx="8" fill="url(#goldGradient)"/>
    <rect x="-150" y="-20" width="20" height="40" rx="6" fill="url(#goldGradient)"/>
    
    <!-- Bar -->
    <rect x="-100" y="-8" width="200" height="16" rx="8" fill="url(#goldGradient)"/>
    
    <!-- Right weight plate -->
    <rect x="100" y="-30" width="40" height="60" rx="8" fill="url(#goldGradient)"/>
    <rect x="130" y="-20" width="20" height="40" rx="6" fill="url(#goldGradient)"/>
    
    <!-- AI Circuit Pattern (simplified) -->
    <circle cx="-60" cy="0" r="4" fill="#0d0d1a" opacity="0.6"/>
    <circle cx="-30" cy="0" r="4" fill="#0d0d1a" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#0d0d1a" opacity="0.6"/>
    <circle cx="30" cy="0" r="4" fill="#0d0d1a" opacity="0.6"/>
    <circle cx="60" cy="0" r="4" fill="#0d0d1a" opacity="0.6"/>
    
    <!-- Connection lines -->
    <line x1="-60" y1="0" x2="-30" y2="0" stroke="#0d0d1a" stroke-width="2" opacity="0.4"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#0d0d1a" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0d0d1a" stroke-width="2" opacity="0.4"/>
    <line x1="30" y1="0" x2="60" y2="0" stroke="#0d0d1a" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- AI Text -->
  <text x="256" y="380" text-anchor="middle" fill="url(#goldGradient)" font-size="48" font-weight="bold" font-family="Arial, sans-serif">AI</text>
</svg>
